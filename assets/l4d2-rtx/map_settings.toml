# ##########################################################################################################################################
# >> Unbake Model Transforms (https://github.com/xoxor4d/l4d2-rtx/wiki/Map-Settings#unbake-models)
# 
# :: If a prop has many unique or unstable hashes (remix) then it's likely that it's vertices contain world position data.
# :: Specifying the checksum of the model you want to replace here will prevent position/rotation/normal information
#    from being backed into the model vertices and then use the fixed function world transform to transform it into the game world. 
# :: Use entry 'ALL' if it's a model used throughout the game. 
# :: This might cause issues with some models (mainly ones with sub-meshes)
# :: Do not specify models if you do not intend to replace them. There is no benefit.
# 
# :: Useful console command:
#    > 'xo_mapsettings_get_unbake_info' to log all currently visible model names to '/logs/mapsettings_unbake_info.log' 
#    > 'xo_debug_toggle_unbake_model_info' for visualizations
#
# ~~ Parameters:
# <map name> = {    per map
#   checksum = []   using the mdl checksum                      [int array - hex format]
# }
#
# ALL = {           ^ on every map
#   checksum = []   ^                                           [int array - hex format]
# }                                                                                

[UNBAKE]

    ALL = { checksum = [
        # examples
        # 0x6f769ab6, # chair_cafeteria.smd
    ]}

    c8m4_interior = { checksum = [
        # examples
        # 0xc18d886e, # styrofoam_cups.smd
        # 0x26fa7caa, # styrofoam_cups_p1.smd
        # 0x6fe3a6a6, # styrofoam_cups_p2.smd
        # 0xa6a03504, # styrofoam_cups_p3.smd
        # 0xfa58eac3, # styrofoam_cups_p4.smd
    ]}



# ##########################################################################################################################################
# >> Spawn unique markers meshes (https://github.com/xoxor4d/l4d2-rtx/wiki/Map-Settings#map-marker-spawning)
#
# :: Can be used as anchor mesh (same one can be spawned multiple times)
#
# :: Useful console commands:
#    > 'xo_debug_scene_print' to print info about all choreographies to the console
#    > 'xo_debug_sound_print' to print info about running sounds to the console
#
# ~~ Parameters:
# <map name> = [        [array of structure below]
#   {                   
#       marker    ]     THIS:   num of marker - (deprecated - no show/hide support)                                             [int 0-100]
#       nocull    ]  OR THAT:   num of marker - never getting culled and spawned on map load                                    [int 0-inf]
#
#       trigger = {             (opt.) show/hide markers via choreography (.vcd) or sound (spawns marker on map load if not defined)
#
#           show = {       
#                       |> choreo   ]    THIS =   |> choreo =         name of choreography (.vcd) (can be a substr)             [string]
#                                   ]             |> actor =   (opt.) name of actor the event is played on                      [string]
#                                   ]             |> event =   (opt.) name of the event within the .vcd (can be a substr)       [string]
#                                   ]             |> param1 =  (opt.) name of the event within the .vcd (can be a substr)       [string]
#                                   ] 
#                       |> sound    ] OR THAT =   EITHER substring of sound name = "sound_substring"                            [string]
#                                                 OR hash = 0x133337 (cmd: see desc.)                                           [integer] (hex format)
#                                               
#                       |> delay =    delay after trigger (in seconds)                                                          [float]
#
#           }, hide = { ... },  (same ^ structure)
#
#           |> always =         allow re-triggering (defaults to false)                                                         [bool]
#       }
#
#       areas = []                    (opt.) only show nocull marker when player is in specified area/s                         [int array]
#       N_leafs = []                  (opt.) only show nocull marker when player is in ^ and NOT in specified leaf/s            [int array]
#       position = []                 position of the marker mesh                                                               [3D Vector]
#       rotation = []                 rotation of the marker mesh                                                               [3D Vector]
#       scale = []                    scale of the marker mesh                                                                  [3D Vector]
#   }, 
#   { ... },
# ]

